name: CI GymManager

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Pruebas unitarias (JUnit)
        run: |
          chmod +x mvnw
          ./mvnw -B clean test -Dtest='!GymmanagerApplicationTests'

      - name: Construir imagen Docker
        run: docker build -t gymmanager-api:latest .