<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="contenido">
    <tr>
        <td class="email-content" align="center"
            style="padding:40px 30px 36px; background-color:#ffffff; text-align:center;">

            <h1 class="email-title"
                style="font-family:'Chakra Petch', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin:0 auto 14px; max-width:460px; font-size:28px; line-height:1.3; font-weight:700; color:#AC1C1C; text-align:center;">
                Inasistencia registrada
            </h1>

            <table cellpadding="0" cellspacing="0" border="0" role="presentation" align="center"
                   style="margin:0 auto 22px; border-collapse:collapse;">
                <tr>
                    <td width="20" height="20" valign="middle" style="font-size:0; line-height:0;">
                        <img src="https://res.cloudinary.com/kwxqqdwn/image/upload/v1791164278/logoRed.png"
                             width="16" height="16" alt="Usuario"
                             style="display:block; border:0; width:16px; height:16px;">
                    </td>
                    <td valign="middle"
                        style="padding-left:6px; font-family:'Chakra Petch', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:14px; line-height:1.6; color:#555555; text-align:left;">
                        <span th:text="${nombreUsuario}">Usuario</span>
                    </td>
                </tr>
            </table>

            <p class="email-text"
               style="font-family:'Chakra Petch', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin:0 auto 28px; max-width:460px; font-size:16px; line-height:1.8; color:#555555; text-align:center;">
                Hemos registrado tu inasistencia a la clase
                <strong th:text="${nombreClase}">Nombre de la clase</strong>
                del día <span th:text="${fechaClase}">23/11/2026</span>.
            </p>

            <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation" align="center"
                   style="margin:0 auto 28px; max-width:420px; background-color:#f9f9f9; border-left:4px solid #AC1C1C; border-radius:4px;">
                <tr>
                    <td style="padding:16px 20px; font-family:'Chakra Petch', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:14px; line-height:1.8; color:#555555; text-align:left;">
                        <strong style="color:#333333;">Detalles de la clase:</strong><br>
                        Clase: <span th:text="${nombreClase}">Nombre de la clase</span><br>
                        Fecha: <span th:text="${fechaClase}">23/11/2026</span>
                    </td>
                </tr>
            </table>

            <p class="email-text"
               style="font-family:'Chakra Petch', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin:0 auto 10px; max-width:460px; font-size:14px; line-height:1.8; color:#888888; text-align:center;">
                Si crees que esto es un error, por favor contacta con tu instructor o con el administrador del gimnasio.
            </p>
        </td>
    </tr>
</th:block>
</body>
</html>
